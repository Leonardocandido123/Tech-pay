<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste QRCode - ZENTRY</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

#reader{
  width:320px;
  border-radius:20px;
  overflow:hidden;
  border:2px solid #22c55e;
}

button{
  margin-top:20px;
  padding:15px 25px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

#resultado{
  margin-top:20px;
  text-align:center;
  font-size:14px;
  word-break:break-all;
}
</style>
</head>
<body>

<h2>Teste da Câmera QRCode</h2>

<div id="reader"></div>

<button onclick="iniciarCamera()">
Abrir câmera
</button>

<div id="resultado">
Aguardando leitura...
</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
let scanner;

async function iniciarCamera(){

  try{

    scanner = new Html5Qrcode("reader");

    const cameras = await Html5Qrcode.getCameras();

    if(cameras && cameras.length){

      await scanner.start(
        cameras[0].id,
        {
          fps:10,
          qrbox:250
        },
        (textoLido)=>{
          document.getElementById("resultado").innerHTML =
            "QR Lido:<br><br>" + textoLido;

          navigator.vibrate?.(200);
        },
        (erro)=>{
          // ignora erros de leitura
        }
      );

    }else{
      alert("Nenhuma câmera encontrada");
    }

  }catch(err){

    console.error(err);

    alert(
      "Erro ao abrir câmera.\n\n" +
      "Teste usando HTTPS ou Netlify."
    );
  }
}
</script>

</body>
</html>
