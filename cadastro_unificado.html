<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZENTRY - Cadastro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #22c55e; 
            --bg: #05070A;
            --border: #2A3441;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            position: fixed; 
            background: radial-gradient(circle at top, #0f172a, #000);
        }

        body { display: flex; flex-direction: column; color: #fff; }

        .top-nav { position: fixed; top: 0; width: 100%; padding: 25px; z-index: 100; }
        .progress-container { width: 100%; height: 3px; background: rgba(255,255,255,0.05); border-radius: 10px; }
        .progress-bar { width: 16.66%; height: 100%; background: var(--accent); border-radius: 10px; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 15px var(--accent); }

        #main-slider {
            display: flex;
            width: 100%;
            height: 100vh;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform;
        }

        .step-page {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 30px;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #9CA3AF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { font-size: 15px; color: #9CA3AF; margin-bottom: 30px; line-height: 1.4; }

        .input-container {
            position: relative;
            border-bottom: 1.5px solid var(--border);
            display: flex;
            align-items: center;
            height: 60px;
            transition: 0.3s;
        }

        .input-container:focus-within { border-bottom-color: var(--accent); }

        input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            outline: none;
            width: 100%;
        }

        .footer { position: fixed; bottom: 50px; right: 30px; display: flex; align-items: center; gap: 20px; z-index: 99; }

        .next-btn {
            width: 55px; height: 55px; border-radius: 16px;
            background: rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center;
            border: none; opacity: 0.3; pointer-events: none;
            transition: 0.3s;
        }

        .next-btn.active { opacity: 1; background: var(--accent); pointer-events: all; box-shadow: 0 0 20px rgba(34, 197, 94, 0.3); }
        .next-btn svg { stroke: #4B5563; stroke-width: 3; transition: 0.3s; }
        .next-btn.active svg { stroke: #000; }

        .finish-btn {
            display: none; padding: 18px 35px; background: var(--accent);
            color: #000; border: none; border-radius: 16px; font-weight: 700; font-size: 16px;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="progress-container"><div id="p-bar" class="progress-bar"></div></div>
    </div>

    <div id="main-slider">
        <!-- ETAPA 0: Nome -->
        <div class="step-page">
            <div class="title">Seu nome</div>
            <div class="subtitle">Como devemos te chamar na plataforma?</div>
            <div class="input-container"><input type="text" id="cad_nome" placeholder="Nome completo" autocomplete="off"></div>
        </div>

        <!-- ETAPA 1: CPF -->
        <div class="step-page">
            <div class="title">Seu CPF</div>
            <div class="subtitle">Precisamos dele para validar sua identidade.</div>
            <div class="input-container"><input type="tel" id="cad_cpf" placeholder="000.000.000-00" maxlength="14"></div>
        </div>

        <!-- ETAPA 2: Celular -->
        <div class="step-page">
            <div class="title">Seu celular</div>
            <div class="subtitle">Informe seu número com DDD.</div>
            <div class="input-container"><input type="tel" id="cad_tel" placeholder="(00) 00000-0000" maxlength="15"></div>
        </div>

        <!-- ETAPA 3: E-mail -->
        <div class="step-page">
            <div class="title">E-mail principal</div>
            <div class="subtitle">Seu e-mail para acesso.</div>
            <div class="input-container"><input type="email" id="cad_email" placeholder="seu@email.com" autocomplete="off"></div>
        </div>

        <!-- ETAPA 4: Senha -->
        <div class="step-page">
            <div class="title">Senha de acesso</div>
            <div class="subtitle">Crie uma senha numérica de 6 dígitos.</div>
            <div class="input-container"><input type="password" id="cad_senha" inputmode="numeric" style="letter-spacing: 8px;" maxlength="6" placeholder="••••••"></div>
        </div>

        <!-- ETAPA 5: Termos -->
        <div class="step-page">
            <div class="title">Termos ZENTRY</div>
            <div class="subtitle">Para finalizar, aceite nossas políticas.</div>
            <label style="display: flex; gap: 15px; color: #9CA3AF; align-items: center; background: rgba(255,255,255,0.03); padding: 20px; border-radius: 16px; border: 1px solid var(--border);">
                <input type="checkbox" id="checkTermo" style="width:22px; height:22px; accent-color: var(--accent);">
                <span style="font-size: 14px;">Li e concordo com os termos.</span>
            </label>
        </div>
    </div>

    <div class="footer">
        <button class="next-btn" id="nextBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button id="finishBtn" class="finish-btn">CRIAR MINHA CONTA</button>
    </div> 

<script>
    let etapaAtual = 0;
    const totalEtapas = 6;
    const slider = document.getElementById('main-slider');
    const pBar = document.getElementById('p-bar');
    const nextBtn = document.getElementById('nextBtn');
    const finishBtn = document.getElementById('finishBtn');

    // --- FUNÇÕES DE MÁSCARA ---
    const mascaraCPF = (value) => {
        return value
            .replace(/\D/g, '') 
            .replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})(\d{1,2})/, '$1-$2')
            .replace(/(-\d{2})\d+?$/, '$1');
    };

    const mascaraTelefone = (value) => {
        return value
            .replace(/\D/g, '')
            .replace(/(\d{2})(\d)/, '($1) $2')
            .replace(/(\d{5})(\d)/, '$1-$2')
            .replace(/(-\d{4})\d+?$/, '$1');
    };

    // --- LÓGICA DE INTERAÇÃO ---
    function atualizarUI() {
        slider.style.transform = `translateX(-${etapaAtual * 100}%)`;
        pBar.style.width = `${((etapaAtual + 1) / totalEtapas) * 100}%`;
        
        if (etapaAtual === totalEtapas - 1) {
            nextBtn.style.display = 'none';
            finishBtn.style.display = 'block';
        } else {
            nextBtn.style.display = 'flex';
            finishBtn.style.display = 'none';
        }
        validarInput();
    }

    function validarInput() {
        const inputs = [
            document.getElementById('cad_nome'),
            document.getElementById('cad_cpf'),
            document.getElementById('cad_tel'),
            document.getElementById('cad_email'),
            document.getElementById('cad_senha'),
            document.getElementById('checkTermo')
        ];
        
        let valRaw = inputs[etapaAtual].value;
        let valido = false;

        if(etapaAtual === 0) valido = valRaw.trim().length > 3;
        if(etapaAtual === 1) valido = valRaw.replace(/\D/g, '').length === 11; // CPF 11 dígitos
        if(etapaAtual === 2) valido = valRaw.replace(/\D/g, '').length >= 10; // Tel 10 ou 11
        if(etapaAtual === 3) valido = valRaw.includes('@') && valRaw.length > 5;
        if(etapaAtual === 4) valido = valRaw.length === 6;
        if(etapaAtual === 5) valido = inputs[5].checked;

        if(valido) nextBtn.classList.add('active');
        else nextBtn.classList.remove('active');
    }

    // Aplicar máscaras nos inputs específicos
    document.getElementById('cad_cpf').addEventListener('input', (e) => {
        e.target.value = mascaraCPF(e.target.value);
        validarInput();
    });

    document.getElementById('cad_tel').addEventListener('input', (e) => {
        e.target.value = mascaraTelefone(e.target.value);
        validarInput();
    });

    // Ouvinte geral para validação
    document.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', validarInput);
    });

    nextBtn.addEventListener('click', () => {
        if(etapaAtual < totalEtapas - 1) {
            etapaAtual++;
            atualizarUI();
            // Focar o próximo input automaticamente
            setTimeout(() => {
                const proximos = ['cad_nome','cad_cpf','cad_tel','cad_email','cad_senha'];
                if(proximos[etapaAtual]) document.getElementById(proximos[etapaAtual]).focus();
            }, 600);
        }
    });

    finishBtn.addEventListener('click', () => {
        // Aqui você insere sua lógica de salvar no Firebase
        alert("Enviando dados para o Zentry...");
        window.location.href = "login.html";
    });

    atualizarUI();
</script>
</body>
</html>
