<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZENTRY Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root { 
    --primary: #10b981; 
    --primary-disabled: #86efac; /* Verde-água fosco da imagem */
    --bg-main: #f4f7f6;
    --bg-card: #ffffff;
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-secondary: #64748b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden; /* Garante que nenhuma barra de rolagem apareça */
    position: fixed;
  }

  body { 
    background-color: var(--bg-main); 
    display: flex; 
    flex-direction: column; 
    align-items: center;
    justify-content: space-between; /* Distribui topo, centro e rodapé perfeitamente */
    padding: 50px 24px 30px 24px; 
    color: var(--text-main);
  }

  .login-container {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    justify-content: center; /* Centraliza o miolo do formulário verticalmente */
  }

  /* ICONE DE CADEADO DO TOPO */
  .lock-circle {
    width: 95px;
    height: 95px;
    background: #e6f4ea;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 35px;
  }
  .lock-circle svg {
    color: #059669;
  }

  /* TEXTOS DE SAUDAÇÃO */
  .title {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text-main);
    text-align: center;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 35px;
    line-height: 1.5;
    text-align: center;
    max-width: 290px;
  }

  /* CARD DO FORMULÁRIO */
  .field-wrapper {
    width: 100%;
    background: var(--bg-card);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.02);
    border: 1px solid rgba(226, 232, 240, 0.8);
  }

  .input-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 10px;
    display: block;
  }

  .password-container {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    height: 54px;
    padding: 0 16px;
    transition: 0.2s ease;
    background: #f8fafc;
    margin-bottom: 20px;
  }

  .password-container:focus-within { 
    border-color: var(--primary); 
    background: #fff;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
  }

  input {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-main);
    font-size: 16px;
    outline: none;
    width: 100%;
    font-weight: 500;
  }
  
  input[type="password"] {
    letter-spacing: 4px;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .eye { 
    width: 20px; 
    height: 20px; 
    color: var(--text-secondary); 
    cursor: pointer; 
    transition: 0.2s;
  }

  .enter-btn {
    width: 100%;
    height: 52px;
    border-radius: 14px;
    background: var(--primary-disabled);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    pointer-events: none;
    transition: 0.2s ease;
  }

  .enter-btn.active { 
    background: var(--primary); 
    pointer-events: all; 
  }

  /* DIVISOR */
  .divider {
    display: flex;
    align-items: center;
    width: 100%;
    margin: 16px 0;
    color: var(--text-secondary);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .divider span {
    padding: 0 12px;
  }

  /* BIOMETRIA */
  .biometric-btn {
    width: 100%;
    height: 52px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text-main);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.2s;
  }
  .biometric-btn svg {
    color: #059669;
  }

  /* LINKS DE RODAPÉ CONSTANTES */
  .links {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 400px;
    padding: 0 4px;
  }

  .links a { color: #059669; text-decoration: none; font-size: 14px; font-weight: 500; }
  .links .lost-pass { color: var(--text-secondary); }

  /* MODAL DE BLINDAGEM */
  #zModalGlobal { 
    display:none; position:fixed; inset:0; background:rgba(15, 23, 42, 0.4); 
    z-index:9999; align-items:center; justify-content:center; padding:20px; 
    backdrop-filter: blur(4px); 
  }
  .modal-content { 
    background: var(--bg-card); border-radius: 24px; width: 100%; 
    max-width: 340px; padding: 28px; text-align: center; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    animation: pop 0.25s ease-out;
  }
  @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>

</head>
<body>

  <div id="zModalGlobal">
    <div class="modal-content">
      <div id="zIcon" style="font-size:40px; margin-bottom:12px;">🔒</div>
      <h3 id="zTitle" style="margin-bottom:8px; font-size:18px; color: var(--text-main);">Erro de Acesso</h3>
      <p id="zText" style="color: var(--text-secondary); font-size:14px; margin-bottom:20px; line-height:1.5;"></p>
      <button id="zBtnClose" style="width:100%; padding:14px; border-radius:12px; background:var(--primary); border:none; color:#fff; font-weight:600; font-size:14px; cursor:pointer;">Entendido</button>
    </div>
  </div>

  <div class="login-container">
    
    <div class="lock-circle">
      <svg width="38" height="38" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <div class="title">Acesse sua conta</div>
    <div class="subtitle">Digite sua senha ZENTRY para acessar sua conta com segurança</div>

    <div class="field-wrapper">
      <span class="input-label">Digite sua senha</span>
      <div class="password-container">
        <input type="password" id="senha" placeholder="••••••••" autocomplete="new-password" spellcheck="false">
        
        <div class="actions">
          <svg class="eye" id="eyeIcon" onclick="window.toggleSenha()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-6 11-6 11 6 11 6-4 6-11 6S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
            <line id="eyeSlash" x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="2" style="opacity:1; transition: 0.2s;"/>
          </svg>
        </div>
      </div>

      <button class="enter-btn" id="btnEntrar" onclick="window.entrar()">
        <span>Entrar</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 7"></polyline>
        </svg>
      </button>

      <div class="divider"><span>ou</span></div>

      <button class="biometric-btn">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 2a10 10 0 0 0-10 10v1a1 1 0 0 0 2 0v-1a8 8 0 1 1 16 0v1a1 1 0 0 0 2 0v-1A10 10 0 0 0 12 2z"/>
          <path d="M12 6a6 6 0 0 0-6 6v3a1 1 0 0 0 2 0v-3a4 4 0 1 1 8 0v3a1 1 0 0 0 2 0v-3a6 6 0 0 0-6-6z"/>
          <path d="M12 10a2 2 0 0 0-2 2v5a1 1 0 0 0 2 0v-5a2 2 0 0 0-2-2z"/>
        </svg>
        Entrar com biometria
      </button>
    </div>
  </div>

  <div class="links">
    <a href="reset.html" class="lost-pass">Esqueci minha senha</a>
    <a href="cadastro_unificado.html" class="create-acc">Criar conta</a>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB4U7iIO3OVrrwyWPPI057jTqZWF6V1osU",
  authDomain: "zentry-app-74275.firebaseapp.com",
  projectId: "zentry-app-74275",
  storageBucket: "zentry-app-74275.appspot.com",
  messagingSenderId: "571422826071",
  appId: "1:571422826071:web:ba1ca6fea76e360bb80d12"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

function showZModal(titulo, texto, icon) {
  document.getElementById('zModalGlobal').style.display = 'flex';
  document.getElementById('zTitle').innerText = titulo;
  document.getElementById('zText').innerText = texto;
  document.getElementById('zIcon').innerText = icon;
}

document.getElementById('zBtnClose').onclick = () => {
  document.getElementById('zModalGlobal').style.display = 'none';
};

window.addEventListener("DOMContentLoaded", () => {
  const input = document.getElementById("senha");
  const btn = document.getElementById("btnEntrar");

  input.addEventListener("input", () => {
    if(input.value.length >= 6) btn.classList.add("active");
    else btn.classList.remove("active");
  });

  window.toggleSenha = function(){
    const slash = document.getElementById("eyeSlash");
    if(input.type === "password"){
      input.type = "text";
      slash.style.opacity = "0";
    } else {
      input.type = "password";
      slash.style.opacity = "1";
    }
  };

  window.entrar = function(){
    if(input.value.length < 6) return;
    const email = localStorage.getItem("usuarioEmail");
  
    if (!email) {
      window.location.href = "login_email.html";
      return;
    }

    btn.innerHTML = `<div style="width:20px; height:20px; border:3px solid #fff; border-top-color:transparent; border-radius:50%; animation: spin 0.8s linear infinite;"></div>`;
    
    signInWithEmailAndPassword(auth, email, input.value)
      .then(() => {
        document.body.style.opacity = "0";
        setTimeout(() => { window.location.href = "home.html"; }, 400);
      })
      .catch((error) => {
        console.error(error);
        btn.innerHTML = `<span>Entrar</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 7"></polyline></svg>`;
        
        let msg = "A senha digitada está incorreta ou o usuário não existe.";
        if(error.code === 'auth/too-many-requests') msg = "Muitas tentativas falhas. Tente novamente mais tarde.";
        
        showZModal("Acesso Negado", msg, "🔒");
      });
  };

  input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") window.entrar();
  });
});
</script>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

</body>
</html>
